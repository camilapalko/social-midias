name: Sincronizar fotos do Drive

on:
  schedule:
    - cron: '0 2 20 * *'   # dia 19, 23h de Brasília
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth pillow pillow-heif
      - name: Copiar fotos novas
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python scripts/sync_drive.py
      - name: Salvar no repositório
        run: |
          git config user.name "sync-drive"
          git config user.email "sync-drive@users.noreply.github.com"
          git add -A '*/fotos/'
          git diff --cached --quiet && echo "nada novo" || (git commit -m "fotos novas do Drive" && git push)
